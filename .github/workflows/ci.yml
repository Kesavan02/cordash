name: CorDash CI

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  validate_and_test:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Print Flutter & Dart Environment
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Anti-Plagiarism SALT & Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Analysis & Lint Verification
        run: flutter analyze

      - name: Execute Automated Unit & Golden Tests
        run: flutter test --coverage

      - name: Build Debug Android APK
        run: flutter build apk --debug
